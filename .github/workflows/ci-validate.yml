name: Hybrid Storage IaC & FinOps CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  terraform-validate:
    name: Terraform Format & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Terraform Init (Backend Disabled)
        run: terraform -chdir=terraform init -backend=false
      - name: Terraform Validate
        run: terraform -chdir=terraform validate

  python-lint-and-test:
    name: Python FinOps Reporter Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt
      - name: Verify Python Syntax
        run: python -m py_compile scripts/hybrid_capacity_reporter.py
